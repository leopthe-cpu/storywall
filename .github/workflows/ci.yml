# Checks every pull request and every push to develop/main.
# Three checks, all required by the branch rules (docs/migration-plan.md):
#   - "lint and build": npm run lint + npm run build must pass.
#   - "secret scan": gitleaks looks for passwords/keys in the code and its
#     history (free for personal accounts, no licence key needed).
#   - "database tests": applies supabase/migrations to a throwaway local
#     Supabase database and runs supabase/tests (pgTAP access-rule tests).
# The Playwright tests (e2e/) are not run here: they run against a live site
# with test-account passwords and change test data, so they are run on
# purpose (see e2e/ and the plan).
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

# A newer push to the same pull request replaces an older, still-running
# check. Runs for pushes to develop/main are never cancelled: a cancelled run
# leaves a red "cancelled" mark on a shared commit (lesson from Mend).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read # the secret scan lists a pull request's commits

jobs:
  lint-build:
    name: lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # whole history, so old commits are scanned too
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  db-tests:
    name: database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      # The database plus the storage service (it creates the storage tables
      # the file-storage rules apply to); everything else is left out.
      - run: supabase start -x gotrue,realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase test db

  # Not (yet) a required check. Starts every Edge Function in Supabase's own
  # runtime and calls it once, so a function that fails to load shows up
  # here, with the error, instead of only as "failed to bundle function" on
  # the staging deploy after merging. Calls carry no key, so a function that
  # loads answers 401 (the @supabase/server sign-in check); a 5xx means it
  # didn't load.
  functions-boot:
    name: edge functions load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      - run: supabase start -x gotrue,realtime,imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor,storage-api
      - name: Serve functions
        run: |
          # --no-verify-jwt: let every call reach the function so it has to load.
          supabase functions serve --no-verify-jwt > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 30); do
            grep -q "Serving functions" "$RUNNER_TEMP/serve.log" && break
            sleep 2
          done
          cat "$RUNNER_TEMP/serve.log"
      - name: Call each function
        run: |
          status=0
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            case "$name" in _*) continue ;; esac
            code=$(curl -s -o "$RUNNER_TEMP/body.txt" -w '%{http_code}' -X POST \
              -H 'content-type: application/json' -d '{}' \
              "http://127.0.0.1:54321/functions/v1/$name")
            echo "$name -> $code: $(head -c 300 "$RUNNER_TEMP/body.txt")"
            if [ "$code" -ge 500 ]; then status=1; fi
          done
          if [ "$status" -ne 0 ]; then cat "$RUNNER_TEMP/serve.log"; fi
          exit $status
